<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office 预览</title>
<!--
  浏览器里渲染 Word / Excel / PPT 的那一页（office-view.js）。**只在一个不带 allow-same-origin 的
  sandbox iframe 里用**（chat.js 的 previewBody）：这里渲染的是文档里的内容，等同外部输入，
  它得跑在一个碰不到 Gateway 登录票、存储和父页面的不透明源里。
-->
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; padding: 0; background: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  #status { padding: 24px; color: #52525b; font-size: 14px; }
  #status[data-error] { color: #b91c1c; }
  #root { padding: 16px; }
  /* docx-preview 的外框：一页一张白纸，居中。 */
  .docx-wrapper { background: transparent !important; padding: 0 !important; }
  .docx-wrapper > section.docx { box-shadow: 0 1px 3px rgba(0,0,0,.15); margin: 0 auto 16px !important; }
  /* Excel：表名页签 + 一张带行号列号的表。 */
  .xl-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  .xl-tabs button { border: 1px solid #d4d4d8; background: #fff; border-radius: 6px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
  .xl-tabs button[data-on] { background: #18181b; color: #fff; border-color: #18181b; }
  .xl-wrap { overflow: auto; background: #fff; border: 1px solid #d4d4d8; }
  table.xl { border-collapse: collapse; table-layout: fixed; font-size: 13px; }
  table.xl td, table.xl th { border: 1px solid #e4e4e7; padding: 2px 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; vertical-align: bottom; }
  table.xl th { background: #f4f4f5; color: #71717a; font-weight: 500; position: sticky; top: 0; z-index: 1; }
  table.xl td.xl-rownum { background: #f4f4f5; color: #71717a; text-align: center; position: sticky; left: 0; }
  .xl-note { color: #71717a; font-size: 12px; margin-top: 8px; }
  /* PPT：一页一页竖着排。 */
  .pp-root { max-width: 1100px; margin: 0 auto; }
</style>
</head>
<body>
<div id="status">正在准备预览…</div>
<div id="root"></div>
<script src="/ui/office-view.js"></script>
</body>
</html>

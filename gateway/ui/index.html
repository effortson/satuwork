<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover：手机壳（mobile/）里页面铺到刘海和 Home 条底下，env(safe-area-inset-*) 才有值，
     由 app.css 末尾那段把安全区让出来；桌面浏览器里这几个值都是 0，等于没写。 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Satuwork Gateway</title>
<link rel="icon" type="image/png" href="/assets/satuwork-logo.png">
<link rel="apple-touch-icon" href="/assets/satuwork-logo.png">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/shell.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/chat.css">
</head>
<body>
<div id="app"></div>
<!-- 这一页里**没有内联脚本**，因为 CSP 的 script-src 不带 'unsafe-inline'（见
     gateway/src/http.ts 的 CSP）。挂 window.satuUnzip 这件事搬进了 unzip.js 自己的末尾。 -->
<script type="module" src="/unzip.js"></script>
<!-- core.js 是 core/src 打出来的（gateway/scripts/build-core.mjs），挂全局 SatuCore：译表、格式化、
     路径解析都从它来。必须在下面所有脚本之前——prefs.js 和 state.js 里是一行行的转接。 -->
<script src="/core.js"></script>
<!-- dom-util.js：复制、存文件这几样，markdown.js 和下面的分片都用，渠道预览页也装它（不是分片）。 -->
<script src="/dom-util.js"></script>
<!-- markdown.js 也要在下面那串之前：chat-thread.js 的 paintChat 直接调 window.satuMd。 -->
<script src="/markdown.js"></script>
<!-- 前端就是这一串普通脚本，同一个全局作用域，按顺序拼起来等于原来那个 app.js。
     data-app-part 是给 e2e 垫片认的：它照着这里的顺序拼源码，顺序永远不会和线上漂开。
     prefs.js 必须第一个（唯一一段加载即执行的代码在它那儿），app.js 必须最后一个（boot()）。 -->
<script src="/prefs.js" data-app-part></script>
<script src="/state.js" data-app-part></script>
<script src="/ui-kit.js" data-app-part></script>
<script src="/data.js" data-app-part></script>
<script src="/shell.js" data-app-part></script>
<script src="/pages-landing.js" data-app-part></script>
<script src="/pages-legal.js" data-app-part></script>
<script src="/pages-admin.js" data-app-part></script>
<script src="/pages-audit.js" data-app-part></script>
<script src="/pages-releases.js" data-app-part></script>
<script src="/pages-companies.js" data-app-part></script>
<script src="/pages-machines.js" data-app-part></script>
<script src="/pages-account.js" data-app-part></script>
<script src="/pages-bots.js" data-app-part></script>
<script src="/pages-tools.js" data-app-part></script>
<script src="/pages-connectors.js" data-app-part></script>
<script src="/pages-plugins.js" data-app-part></script>
<script src="/pages-routines.js" data-app-part></script>
<script src="/pages-handoffs.js" data-app-part></script>
<script src="/pages-channels.js" data-app-part></script>
<script src="/pages-knowledge.js" data-app-part></script>
<script src="/chat.js" data-app-part></script>
<script src="/notification-sync.js" data-app-part></script>
<script src="/web-notifications.js" data-app-part></script>
<script src="/desktop-notifications.js" data-app-part></script>
<script src="/chat-stream.js" data-app-part></script>
<script src="/chat-bubble.js" data-app-part></script>
<script src="/chat-thread.js" data-app-part></script>
<script src="/chat-meta.js" data-app-part></script>
<script src="/chat-seat.js" data-app-part></script>
<script src="/chat-workspace.js" data-app-part></script>
<script src="/chat-desktop.js" data-app-part></script>
<script src="/chat-preview.js" data-app-part></script>
<script src="/chat-page.js" data-app-part></script>
<script src="/chat-composer.js" data-app-part></script>
<script src="/chat-decide.js" data-app-part></script>
<script src="/chat-toolpop.js" data-app-part></script>
<script src="/chat-find.js" data-app-part></script>
<script src="/render.js" data-app-part></script>
<script src="/actions.js" data-app-part></script>
<script src="/app.js" data-app-part></script>
</body>
</html>

# Separate regional artifacts. Never creates or overwrites an international GitHub Release.
name: desktop-distribution
on:
  workflow_dispatch:
    inputs:
      channel:
        description: China distribution channel (stable from main, beta from develop)
        type: choice
        options: [stable, beta]
        required: true
      version:
        description: Immutable version (X.Y.Z for stable; X.Y.Z-beta.N for beta)
        required: true
permissions:
  contents: read
concurrency:
  group: desktop-cn-${{ inputs.channel }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      # 同 bot-release：一个架构挂了不取消另一个，但 release 要整套齐了才发。
      fail-fast: false
      matrix:
        include:
          # macOS 要 app 这一档才会出升级包（.app.tar.gz），dmg 给首次安装。
          - os: macos
            arch: arm64
            tauri_arch: aarch64
            bundle: app,dmg
            runner: macos-14
          - os: macos
            arch: x64
            tauri_arch: x64
            bundle: app,dmg
            runner: macos-15-intel
          - os: windows
            arch: x64
            tauri_arch: x64
            bundle: nsis
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      DESKTOP_DISTRIBUTION_CONFIG: ${{ secrets.CN_DESKTOP_CONFIG }}
      DISTRIBUTION_CHANNEL: ${{ inputs.channel }}
      DISTRIBUTION_VERSION: ${{ inputs.version }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check source channel
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          case "$CHANNEL:$GITHUB_REF" in
            stable:refs/heads/main|beta:refs/heads/develop) ;;
            *) echo 'Channel/source branch mismatch' >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: 校验 checkout 的提交
        env:
          WANT_SHA: ${{ github.sha }}
        run: |
          got=$(git rev-parse HEAD)
          [ "$got" = "$WANT_SHA" ] || {
            echo "checkout 出来是 $got，要构建的却是 $WANT_SHA" >&2; exit 1; }

      # 别升到 v6：v6.1.0 拿锁文件核对 pnpm 原生二进制，锁文件里没有 darwin-x64 那份，Intel Mac 上装不上
      # （.github/dependabot.yml 挡了它的大版本升级）。版本注释单独放在下一行末尾，dependabot 才认得出、会跟着改。
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      # 这一份 Node 会被 prepare-runtime.mjs 原样拷进安装包（process.execPath），
      # 所以它的架构就是包里 Node 的架构——下面那步校验的正是这个。
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 校验 runner 架构
        run: |
          got=$(node -p 'process.arch')
          [ "$got" = "${{ matrix.arch }}" ] || {
            echo "runner 是 $got，矩阵却说 ${{ matrix.arch }}" >&2; exit 1; }

      - name: Configure isolated distribution
        run: |
          node desktop/scripts/distribution.mjs
          node -e 'const fs=require("fs");fs.appendFileSync(process.env.GITHUB_ENV,"PRODUCT_NAME="+require("./desktop/src-tauri/tauri.conf.json").productName+"\n")' 

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 分支，2026-09-03
        with:
          # 按 SHA 引用时它没法从 ref 名（@stable）推出工具链，得写明。
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: './desktop/src-tauri -> target'

      # 证书得在「准备本地 Bot 运行时」之前就进钥匙串：bot.tgz 里的原生二进制（esbuild、
      # fsevents.node、napi 预编译件）要在打包之前签好——Apple 公证会解开 tgz 逐个查。所以不让
      # Tauri 自己导证书（它只在 tauri build 里导），这里建一个临时钥匙串导进去，两处共用。
      - name: 导入签名证书
        if: matrix.os == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          for k in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            [ -n "${!k:-}" ] || { echo "没有 $k：macOS 包签不了名" >&2; exit 1; }
          done
          kc="$RUNNER_TEMP/satuwork-signing.keychain-db"
          kp=$(openssl rand -hex 24)
          p12="$RUNNER_TEMP/cert.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" >/dev/null
          # 加进搜索列表（保留原有的），Tauri 按 APPLE_SIGNING_IDENTITY 找身份时才找得到。
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$p12"
          security find-identity -v -p codesigning "$kc"
          security find-identity -v -p codesigning "$kc" | grep -qF "$APPLE_SIGNING_IDENTITY" || {
            echo "p12 里没有「$APPLE_SIGNING_IDENTITY」这个身份（导出时要连证书带私钥一起）" >&2; exit 1; }
          echo "SATUWORK_CODESIGN_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "SATUWORK_CODESIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - name: 准备本地 Bot 运行时
        run: pnpm --filter satuwork-desktop prepare:runtime

      - name: 准备 UI
        run: pnpm --filter satuwork-desktop prepare:ui

      # macOS 用 dmg（外加升级用的 app），Windows 用 nsis。
      #
      # createUpdaterArtifacts 只在这里用 --config 打开，不写进 tauri.conf.json：写进去的话本地
      # `pnpm build` 没有私钥就出不了包，而本地包本来也不走自动升级。
      # 公证用的 App Store Connect 私钥只能以文件路径交给 Tauri（APPLE_API_KEY_PATH），落到
      # runner 的临时目录里，job 结束就没了。
      - name: 写入公证密钥
        if: matrix.os == 'macos'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          [ -n "$APPLE_API_KEY_P8" ] || { echo "没有 APPLE_API_KEY_P8：公证不了" >&2; exit 1; }
          p="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$p"
          chmod 600 "$p"
          echo "APPLE_API_KEY_PATH=$p" >> "$GITHUB_ENV"

      - name: 打包
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 只给 macOS 那两档；Windows 那档拿到也用不上。证书已经在「导入签名证书」那步进了
          # 钥匙串，这里**不再给 APPLE_CERTIFICATE**——给了 Tauri 会再建一个钥匙串重导一遍。
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ matrix.os == 'macos' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ matrix.os == 'macos' && secrets.APPLE_API_KEY || '' }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || {
            echo "没有 TAURI_SIGNING_PRIVATE_KEY：出不了升级包，装过的桌面端收不到这一版" >&2; exit 1; }
          if [ "${{ matrix.os }}" = "macos" ]; then
            for k in SATUWORK_CODESIGN_IDENTITY APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH; do
              [ -n "${!k:-}" ] || { echo "没有 $k：macOS 包签不了名或公证不了" >&2; exit 1; }
            done
          fi
          pnpm --filter satuwork-desktop exec tauri build --bundles ${{ matrix.bundle }} \
            --config '{"bundle":{"createUpdaterArtifacts":true}}'

      # Tauri 只公证 .app（钉好票据后再装进 dmg、打成升级包），dmg 本身没交过。不交的话，下载来的
      # dmg 在没联网的机器上打开时 Gatekeeper 查不到票据。这里补交一次、钉上。
      - name: 公证 dmg
        if: matrix.os == 'macos'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          v=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          dmg="desktop/src-tauri/target/release/bundle/dmg/${PRODUCT_NAME}_${v}_${{ matrix.tauri_arch }}.dmg"
          codesign -dv "$dmg" 2>&1 || echo "（dmg 本身没签名，照样交公证）"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
          xcrun stapler staple "$dmg"

      # 签名、公证、票据都在，而且包里的 Node 真能跑起来（见文件头）。任何一条不过都失败。
      - name: 校验签名
        if: matrix.os == 'macos'
        run: |
          set -euo pipefail
          v=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          b=desktop/src-tauri/target/release/bundle
          app="$b/macos/${PRODUCT_NAME}.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E 'Authority=Developer ID Application|TeamIdentifier|flags='
          # 先存下来再 grep：`| grep -q` 提前退出会让前面的管道吃 SIGPIPE，pipefail 下整步误判失败。
          gk=$(spctl -a -t exec -vv "$app" 2>&1); echo "$gk"
          grep -q 'Notarized Developer ID' <<<"$gk" || { echo ".app 没过 Gatekeeper 的公证检查" >&2; exit 1; }
          xcrun stapler validate "$app"

          # 升级包里的那份才是装过的人拿到的，单独解开看一遍。
          t=$(mktemp -d)
          tar -xzf "$b/macos/${PRODUCT_NAME}.app.tar.gz" -C "$t"
          gk=$(spctl -a -t exec -vv "$t/${PRODUCT_NAME}.app" 2>&1); echo "$gk"
          grep -q 'Notarized Developer ID' <<<"$gk" || { echo "升级包里的 .app 没过公证检查" >&2; exit 1; }

          dmg="$b/dmg/${PRODUCT_NAME}_${v}_${{ matrix.tauri_arch }}.dmg"
          xcrun stapler validate "$dmg"

          # 包里的 Node：看它是谁签的、带没带 JIT 权限，再真跑一段会触发 JIT 的循环。
          n="$app/Contents/Resources/runtime/node/bin/node"
          [ -x "$n" ] || { echo "包里没有 Node：$n" >&2; exit 1; }
          codesign -dv --entitlements - "$n" 2>&1 | grep -E 'Authority=|TeamIdentifier|flags=|allow-jit|unsigned-executable-memory' || true
          "$n" -e 'let s = 0; for (let i = 0; i < 5e7; i++) s += i % 7; console.log("node 能跑：", process.version, process.arch, s)'

      # 安装包、升级包、升级包的签名收进 out/，名字统一带版本和架构。macOS 的升级包 Tauri 起名
      # 就叫 ${PRODUCT_NAME}.app.tar.gz、两个架构同名，不改名的话合进同一个 Release 会互相覆盖。
      - name: Verify and inventory signed artifacts
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: node desktop/scripts/distribution-artifacts.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-cn-${{ inputs.channel }}-${{ matrix.os }}-${{ matrix.arch }}
          path: out/*
          retention-days: 14

# 构建 Desktop 安装包（macOS、Windows）：建 GitHub Release，再同步到 `desktop-latest`。
#
# 打 `desktop-v0.1.0` 这样的 tag 触发。**tag 里的版本必须等于 tauri.conf.json 的 version**：
# 资产名是 Tauri 按那个 version 起的（`Satuwork_<版本>_<架构>.dmg`、`Satuwork_<版本>_x64-setup.exe`），
# 两边对不上的话 Release 的名字和里面的包说的不是同一版，而 CI 照样是绿的。所以在这儿先断言。
#
# **首页的下载那一段不认 `desktop-v*`**，只认一个固定的 Release：`desktop-latest`
# （gateway/ui/pages-landing.js 的 dlBase + dlBuilds）。每次发版最后一个 job（sync-latest）把
# 那儿对齐到最新的正式版：三个包去掉版本号传上去，页面上的地址于是永远不用改。不用 GitHub
# 自带的 `releases/latest`：几条发布线共用一个 Release 列表，那个「Latest」指的是别条线上最新的包。
#
# 手动触发支持填 tag 发布到指定 Release；留空则只出 artifact、不建/更新 Release。
# **填了 tag 就按那个 tag 的代码构建**，不是按「Use workflow from」选的分支：先查 tag 在不在
# （不在就失败，手动触发从不新建 tag），checkout `refs/tags/<tag>`，再断言 HEAD 就是 tag 指的
# 提交、tauri.conf.json 的版本等于 tag 里的版本。以前是 checkout 分支，develop 上版本号没改的话
# 断言照过，`--clobber` 就拿 develop 的代码把正式 Release 的安装包盖了；tag 不存在时
# `gh release create` 还会在默认分支 HEAD 上新建一个。注意 workflow 文件本身仍取自所选分支。
#
# 不传 Gateway。装过的桌面端自己升级（desktop/src-tauri/src/self_update.rs）：它去问
# `desktop-latest` 里那份 `latest.json`，照里面的地址从 `desktop-v<版本>` 取升级包、验签、装。
# 所以每次构建还要多出两样东西：
# - **升级包和签名**：macOS 是 `.app.tar.gz`，Windows 就是那个 setup.exe 本身；签名用的是
#   secret 里的 TAURI_SIGNING_PRIVATE_KEY（+ _PASSWORD），公钥在 tauri.conf.json 的
#   plugins.updater.pubkey。**两边是一对**，换钥匙要一起换，而且换了之后旧壳验不过新包，
#   只能手动重装一次。私钥丢了同理。
# - **latest.json**：release job 拿三份签名拼出来，传到这一版的 Release；sync-latest 再把最新
#   正式版的那份同步到 desktop-latest。里面的下载地址指向 `desktop-v<版本>`（不变的那份），
#   不指 desktop-latest（那边的包每次发版都会被换掉）。
# 本地 Bot 运行时是另一条线（local-bot-release.yml）。
#
# **macOS 签名 + 公证**（Developer ID Application: ADIX INTELLIGENCE PTE. LTD.，团队 37TR7L5SSP）：
# Tauri 看到 APPLE_CERTIFICATE 会自己建临时钥匙串导入证书、签 .app、交公证、钉票据；dmg 由下面
# 「公证 dmg」那步另交一次。六个 secret：APPLE_CERTIFICATE（p12 的 base64）、
# APPLE_CERTIFICATE_PASSWORD、APPLE_SIGNING_IDENTITY、APPLE_API_ISSUER、APPLE_API_KEY、
# APPLE_API_KEY_P8（App Store Connect 的 .p8 内容）。缺了 macOS 那两档直接失败，不发半成品。
# 「校验签名」那步会跑一遍包里的 Node：它被重签后丢了 JIT 权限的话，签名、公证都照过，
# 本地 Bot 却一起就崩——这种事只有真跑一下才看得出来。
#
# **Windows 仍没有签名**，会弹 SmartScreen；要单独的代码签名证书。
name: desktop-release

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 发布到的 tag（例如 desktop-v0.1.0；留空则在 tag 推送时使用当前 tag，手动触发留空时只产出 artifact）
        required: false
        default: ''
      note:
        description: 这次发布的说明（新建 Release 时使用）
        required: false
        default: ''

# 默认只读；要写 Release 的 job 自己再要 contents: write。
permissions:
  contents: read

jobs:
  # 定下这次发的 tag 和要构建的提交，后面的 job 都只认这里的输出。
  # - tag 推送：tag 就是触发的那个。
  # - 手动触发填了 tag：校验格式（输入是任意字符串，只经 env 传、不直接拼进脚本），
  #   查仓库里这个 tag 解到哪个提交（annotated tag 也一路解到提交），查不到就失败。
  # - 手动触发没填、也不是从 tag 上跑的：tag 为空，按所选分支构建，只出 artifact。
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
      sha: ${{ steps.r.outputs.sha }}
      ref: ${{ steps.r.outputs.ref }}
    steps:
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG_INPUT:-}"
          if [ -z "$tag" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          fi
          if [ -z "$tag" ]; then
            echo "没有目标 tag：按 $GITHUB_REF 构建，只出 artifact"
            { echo "tag="; echo "sha=$GITHUB_SHA"; echo "ref=$GITHUB_SHA"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          re='^desktop-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          [[ "$tag" =~ $re ]] || { echo "tag 格式不对：要 desktop-vX.Y.Z 或 desktop-vX.Y.Z-后缀" >&2; exit 1; }
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$tag" --jq .sha 2>/dev/null) || sha=""
          [ -n "$sha" ] || { echo "仓库里没有 tag $tag：先打 tag 推上去，手动触发不会新建 tag" >&2; exit 1; }
          echo "目标 tag：$tag（$sha）"
          { echo "tag=$tag"; echo "sha=$sha"; echo "ref=refs/tags/$tag"; } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    strategy:
      # 同 bot-release：一个架构挂了不取消另一个，但 release 要整套齐了才发。
      fail-fast: false
      matrix:
        include:
          # macOS 要 app 这一档才会出升级包（.app.tar.gz），dmg 给首次安装。
          - os: macos
            arch: arm64
            tauri_arch: aarch64
            bundle: app,dmg
            runner: macos-14
          - os: macos
            arch: x64
            tauri_arch: x64
            bundle: app,dmg
            runner: macos-15-intel
          - os: windows
            arch: x64
            tauri_arch: x64
            bundle: nsis
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: 校验 checkout 的提交
        env:
          WANT_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          got=$(git rev-parse HEAD)
          [ "$got" = "$WANT_SHA" ] || {
            echo "checkout 出来是 $got，要构建的却是 $WANT_SHA" >&2; exit 1; }

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0（v6 拿锁文件核对 pnpm 原生二进制，锁文件里没有 darwin-x64 那份，Intel Mac 上装不上）

      # 这一份 Node 会被 prepare-runtime.mjs 原样拷进安装包（process.execPath），
      # 所以它的架构就是包里 Node 的架构——下面那步校验的正是这个。
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 校验 runner 架构
        run: |
          got=$(node -p 'process.arch')
          [ "$got" = "${{ matrix.arch }}" ] || {
            echo "runner 是 $got，矩阵却说 ${{ matrix.arch }}" >&2; exit 1; }

      - name: 校验 tag 与 tauri.conf.json 版本一致
        if: needs.resolve.outputs.tag != ''
        env:
          TARGET_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          want="${TARGET_TAG#desktop-v}"
          got=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          [ "$got" = "$want" ] || {
            echo "tag 是 $want，tauri.conf.json 却是 $got：资产名会按后者起，Release 按前者建" >&2; exit 1; }

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 分支，2026-09-03
        with:
          # 按 SHA 引用时它没法从 ref 名（@stable）推出工具链，得写明。
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: './desktop/src-tauri -> target'

      - name: 准备本地 Bot 运行时
        run: pnpm --filter satuwork-desktop prepare:runtime

      - name: 准备 UI
        run: pnpm --filter satuwork-desktop prepare:ui

      # macOS 用 dmg（外加升级用的 app），Windows 用 nsis。
      #
      # createUpdaterArtifacts 只在这里用 --config 打开，不写进 tauri.conf.json：写进去的话本地
      # `pnpm build` 没有私钥就出不了包，而本地包本来也不走自动升级。
      # 公证用的 App Store Connect 私钥只能以文件路径交给 Tauri（APPLE_API_KEY_PATH），落到
      # runner 的临时目录里，job 结束就没了。
      - name: 写入公证密钥
        if: matrix.os == 'macos'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          [ -n "$APPLE_API_KEY_P8" ] || { echo "没有 APPLE_API_KEY_P8：公证不了" >&2; exit 1; }
          p="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$p"
          chmod 600 "$p"
          echo "APPLE_API_KEY_PATH=$p" >> "$GITHUB_ENV"

      - name: 打包
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 只给 macOS 那两档；Windows 那档拿到也用不上。
          APPLE_CERTIFICATE: ${{ matrix.os == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.os == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_ISSUER: ${{ matrix.os == 'macos' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ matrix.os == 'macos' && secrets.APPLE_API_KEY || '' }}
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || {
            echo "没有 TAURI_SIGNING_PRIVATE_KEY：出不了升级包，装过的桌面端收不到这一版" >&2; exit 1; }
          if [ "${{ matrix.os }}" = "macos" ]; then
            for k in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH; do
              [ -n "${!k:-}" ] || { echo "没有 $k：macOS 包签不了名或公证不了" >&2; exit 1; }
            done
          fi
          pnpm --filter satuwork-desktop exec tauri build --bundles ${{ matrix.bundle }} \
            --config '{"bundle":{"createUpdaterArtifacts":true}}'

      # Tauri 只公证 .app（钉好票据后再装进 dmg、打成升级包），dmg 本身没交过。不交的话，下载来的
      # dmg 在没联网的机器上打开时 Gatekeeper 查不到票据。这里补交一次、钉上。
      - name: 公证 dmg
        if: matrix.os == 'macos'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          v=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          dmg="desktop/src-tauri/target/release/bundle/dmg/Satuwork_${v}_${{ matrix.tauri_arch }}.dmg"
          codesign -dv "$dmg" 2>&1 || echo "（dmg 本身没签名，照样交公证）"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
          xcrun stapler staple "$dmg"

      # 签名、公证、票据都在，而且包里的 Node 真能跑起来（见文件头）。任何一条不过都失败。
      - name: 校验签名
        if: matrix.os == 'macos'
        run: |
          set -euo pipefail
          v=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          b=desktop/src-tauri/target/release/bundle
          app="$b/macos/Satuwork.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E 'Authority=Developer ID Application|TeamIdentifier|flags='
          # 先存下来再 grep：`| grep -q` 提前退出会让前面的管道吃 SIGPIPE，pipefail 下整步误判失败。
          gk=$(spctl -a -t exec -vv "$app" 2>&1); echo "$gk"
          grep -q 'Notarized Developer ID' <<<"$gk" || { echo ".app 没过 Gatekeeper 的公证检查" >&2; exit 1; }
          xcrun stapler validate "$app"

          # 升级包里的那份才是装过的人拿到的，单独解开看一遍。
          t=$(mktemp -d)
          tar -xzf "$b/macos/Satuwork.app.tar.gz" -C "$t"
          gk=$(spctl -a -t exec -vv "$t/Satuwork.app" 2>&1); echo "$gk"
          grep -q 'Notarized Developer ID' <<<"$gk" || { echo "升级包里的 .app 没过公证检查" >&2; exit 1; }

          dmg="$b/dmg/Satuwork_${v}_${{ matrix.tauri_arch }}.dmg"
          xcrun stapler validate "$dmg"

          # 包里的 Node：看它是谁签的、带没带 JIT 权限，再真跑一段会触发 JIT 的循环。
          n="$app/Contents/Resources/runtime/node/bin/node"
          [ -x "$n" ] || { echo "包里没有 Node：$n" >&2; exit 1; }
          codesign -dv --entitlements - "$n" 2>&1 | grep -E 'Authority=|TeamIdentifier|flags=|allow-jit|unsigned-executable-memory' || true
          "$n" -e 'let s = 0; for (let i = 0; i < 5e7; i++) s += i % 7; console.log("node 能跑：", process.version, process.arch, s)'

      # 安装包、升级包、升级包的签名收进 out/，名字统一带版本和架构。macOS 的升级包 Tauri 起名
      # 就叫 Satuwork.app.tar.gz、两个架构同名，不改名的话合进同一个 Release 会互相覆盖。
      - name: 核对产物
        run: |
          set -euo pipefail
          v=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          a="${{ matrix.tauri_arch }}"
          b=desktop/src-tauri/target/release/bundle
          mkdir -p out
          take() {
            [ -f "$1" ] || {
              echo "没有 $1，实际目录内容：" >&2
              ls -la "$(dirname "$1")" >&2 || true
              exit 1
            }
            cp "$1" "out/$2"
          }
          if [ "${{ matrix.os }}" = "macos" ]; then
            take "$b/dmg/Satuwork_${v}_${a}.dmg"        "Satuwork_${v}_${a}.dmg"
            take "$b/macos/Satuwork.app.tar.gz"         "Satuwork_${v}_${a}.app.tar.gz"
            take "$b/macos/Satuwork.app.tar.gz.sig"     "Satuwork_${v}_${a}.app.tar.gz.sig"
          else
            take "$b/nsis/Satuwork_${v}_${a}-setup.exe"     "Satuwork_${v}_${a}-setup.exe"
            take "$b/nsis/Satuwork_${v}_${a}-setup.exe.sig" "Satuwork_${v}_${a}-setup.exe.sig"
          fi
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: out/*
          retention-days: 14

  release:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # 建 Release / 上传资产要写仓库内容
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - name: 发布到 GitHub Release
        if: needs.resolve.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NOTE: ${{ inputs.note }}
          target_tag: ${{ needs.resolve.outputs.tag }}
          WANT_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          # 构建要几十分钟，这期间 tag 可能被挪过：再解一次，对不上就不发，免得包和 tag 说的不是同一份代码。
          now=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$target_tag" --jq .sha)
          [ "$now" = "$WANT_SHA" ] || {
            echo "tag $target_tag 现在指向 $now，构建用的是 $WANT_SHA：tag 被挪过，不发" >&2; exit 1; }

          # 升级清单。签名是 .sig 文件的**内容**（Tauri 只认内容，不认路径）；三个平台缺一个都不发——
          # 插件会先校验整份文件，任何一个平台不完整，所有平台都查不到更新。
          v="${target_tag#desktop-v}"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$target_tag"
          V="$v" BASE="$base" NOTE="${NOTE:-}" node -e '
            const fs = require("fs")
            const { V, BASE, NOTE } = process.env
            const plat = {
              "darwin-aarch64": `Satuwork_${V}_aarch64.app.tar.gz`,
              "darwin-x86_64": `Satuwork_${V}_x64.app.tar.gz`,
              "windows-x86_64": `Satuwork_${V}_x64-setup.exe`,
            }
            const platforms = {}
            for (const [key, file] of Object.entries(plat)) {
              const sig = fs.readFileSync(`dist/${file}.sig`, "utf8").trim()
              if (!sig || !fs.existsSync(`dist/${file}`)) throw new Error(`${key} 缺包或缺签名`)
              platforms[key] = { signature: sig, url: `${BASE}/${file}` }
            }
            const manifest = { version: V, notes: NOTE, pub_date: new Date().toISOString().replace(/\.\d+Z$/, "Z"), platforms }
            fs.writeFileSync("dist/latest.json", JSON.stringify(manifest, null, 2) + "\n")
          '
          # 签名已经进了 latest.json，不另挂到 Release 上。
          rm -f dist/*.sig
          cat dist/latest.json

          if [ -n "${NOTE:-}" ]; then
            printf '%s\n' "$NOTE" > notes.md
          else
            {
              echo 'Satuwork 桌面端（macOS、Windows）。'
              echo
              echo '- **macOS**：Apple 芯片选 aarch64，Intel 选 x64。'
              echo '- **Windows**：64 位选 x64-setup.exe。'
              echo
              echo 'macOS 包已签名并经 Apple 公证，直接打开即可。'
              echo
              echo '**Windows 包还没有签名**：SmartScreen 会提示拦截，在提示框中点击「更多信息」→「仍要运行」。'
              echo
              echo '已装过 0.1.2 及以上版本的桌面端会在侧栏提示升级，不用手动下载。'
            } > notes.md
          fi

          # 如果 Release 已存在（例如已有 macOS dmg，现在补充 Windows exe），则追加/覆盖资产并更新说明；
          # 如果不存在，则新建 Release。
          if gh release view "$target_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $target_tag 已存在，上传/更新资产..."
            gh release upload "$target_tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$target_tag" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            echo "Release $target_tag 不存在，新建 Release..."
            # --latest=false：仓库的「Latest」不归桌面端。不写的话 GitHub 按日期自动挑，
            # 桌面端一发版就把它从别条线手里抢过来（desktop-v0.1.1 就这么抢过一次）。
            # 首页要的「桌面端最新版」走的是下面那个 desktop-latest，不靠这个标记。
            # --verify-tag：tag 不在就失败，绝不让 gh 在默认分支 HEAD 上新建 tag（resolve 已查过，这是兜底）。
            gh release create "$target_tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$target_tag" \
              --notes-file notes.md \
              --latest=false
          fi

  # 首页的下载那一段指着 desktop-latest（见 gateway/ui/pages-landing.js 的 dlBase）。
  #
  # **这个 job 不看「这次发的是哪个 tag」**：每次都把 desktop-latest 对齐到当时最新的那个
  # 正式版 desktop-v*（包从那一版自己的 Release 上取）。所以谁最后跑谁说了算，结果都一样——
  # 手动补发一个老 tag 不会把首页换回旧包，两个 tag 前后脚推也不会让慢的那个盖掉快的。
  # concurrency 让它们排队、一次只一个在动 desktop-latest；排着的被更新的一次顶掉也无妨。
  sync-latest:
    needs: [resolve, release]
    if: needs.resolve.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # 传资产、改名、挪 tag 都要写仓库内容
    concurrency:
      group: desktop-latest
      cancel-in-progress: false
    steps:
      - name: 同步到 desktop-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"

          # 最新的**正式版**。翻遍全部 Release（--paginate：四条发布线共用这个列表，只看最近
          # N 个的话桌面端的会被挤出去）；草稿、标了预发布的不算，版本号只认纯 X.Y.Z——
          # `sort -V` 把 0.2.0-rc.1 排在 0.2.0 后面，带后缀的不先滤掉，rc 一发首页就换成 rc，
          # 之后的正式版反倒被当成旧的。
          newest=$(gh api --paginate "repos/$repo/releases?per_page=100" \
              --jq '.[] | select((.draft | not) and (.prerelease | not)) | .tag_name' \
            | sed -n 's/^desktop-v\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$/\1/p' | sort -V | tail -1)
          [ -n "$newest" ] || { echo "还没有正式版的 desktop-v* Release，不动 desktop-latest"; exit 0; }
          # tag 可能是 annotated 的，commits/<ref> 会一路解到提交上。
          sha=$(gh api "repos/$repo/commits/desktop-v${newest}" --jq .sha)
          title="桌面端最新版（desktop-v${newest}）"
          echo "最新正式版：desktop-v${newest}（${sha}）"

          asset_id() {
            gh api "repos/$repo/releases/tags/desktop-latest" --jq ".assets[] | select(.name == \"$1\") | .id"
          }
          # desktop-latest 这个 tag 跟着挪到那一版的提交上：不挪的话它永远停在第一次建它的那个
          # 提交，Release 页上的源码包和标题说的不是同一版。
          move_tag() {
            gh api -X PATCH "repos/$repo/git/refs/tags/desktop-latest" -f sha="$sha" -F force=true >/dev/null
          }

          exists=false
          if gh release view desktop-latest --repo "$repo" >/dev/null 2>&1; then exists=true; fi

          # 那一版有没有升级清单。接入自动升级之前发的版本没有，那时 desktop-latest 也不放。
          has_manifest=false
          if [ -n "$(gh api "repos/$repo/releases/tags/desktop-v${newest}" --jq '.assets[] | select(.name == "latest.json") | .id')" ]; then
            has_manifest=true
          fi

          # 已经对齐了就别再搬三百兆：标题是最后一步才改的，标题对上说明上一次整套换完了。
          if $exists && [ "$(gh release view desktop-latest --repo "$repo" --json name --jq .name)" = "$title" ] \
            && [ -n "$(asset_id Satuwork_x64-setup.exe)" ] && [ -n "$(asset_id Satuwork_aarch64.dmg)" ] \
            && [ -n "$(asset_id Satuwork_x64.dmg)" ] \
            && { ! $has_manifest || [ -n "$(asset_id latest.json)" ]; }; then
            move_tag
            echo "desktop-latest 已经是 desktop-v${newest}，不用再传"
            exit 0
          fi

          # 三个包去掉版本号那一截——**名字和 dlBuilds 里的 file 是一对**，改一边要改另一边
          # （e2e/ui-smoke.mjs 里有一条用例盯着）。
          mkdir -p src latest
          gh release download "desktop-v${newest}" --repo "$repo" --dir src \
            --pattern "Satuwork_${newest}_x64-setup.exe" \
            --pattern "Satuwork_${newest}_aarch64.dmg" \
            --pattern "Satuwork_${newest}_x64.dmg"
          mv "src/Satuwork_${newest}_x64-setup.exe" latest/Satuwork_x64-setup.exe
          mv "src/Satuwork_${newest}_aarch64.dmg"   latest/Satuwork_aarch64.dmg
          mv "src/Satuwork_${newest}_x64.dmg"       latest/Satuwork_x64.dmg
          # 装过的桌面端问的就是这一份（tauri.conf.json 的 plugins.updater.endpoints）。里面的
          # 地址指向 desktop-v<版本>，原样搬过来，不用改。
          if $has_manifest; then
            gh release download "desktop-v${newest}" --repo "$repo" --dir latest --pattern latest.json
          fi

          {
            echo "Satuwork 桌面端的**最新版**，当前是 desktop-v${newest}。"
            echo
            echo "这个 Release 每次发新版都会被覆盖，文件名不带版本号，官网首页的下载按钮指的就是这里。"
            echo "要某一个具体版本，去对应的 \`desktop-v<版本>\` Release。"
          } > latest-notes.md

          if ! $exists; then
            # --latest=false：别把仓库的「Latest」抢过来，那个位置归别条发布线。
            gh release create desktop-latest latest/* \
              --repo "$repo" \
              --target "$sha" \
              --title "$title" \
              --notes-file latest-notes.md \
              --latest=false
            exit 0
          fi

          # **不直接 --clobber 覆盖正式名字**：gh 是先删旧的再传新的，一个包传几十秒，这段时间
          # 首页那颗按钮是 404；传到一半断了，旧包已经没了，要等人重跑。所以先整套传成
          # `<名字>.next`（--clobber 只会碰上一次没换完留下的 .next），三个都传完了再逐个
          # 「删旧的、把 .next 改成正式名」——空档只剩两次 API 调用那么长。
          mkdir -p next
          for f in latest/*; do ln "$f" "next/$(basename "$f").next"; done
          gh release upload desktop-latest next/* --repo "$repo" --clobber
          for f in latest/*; do
            name=$(basename "$f")
            next_id=$(asset_id "$name.next")
            [ -n "$next_id" ] || { echo "$name.next 没传上去" >&2; exit 1; }
            old_id=$(asset_id "$name")
            [ -z "$old_id" ] || gh api -X DELETE "repos/$repo/releases/assets/$old_id"
            gh api -X PATCH "repos/$repo/releases/assets/$next_id" -f name="$name" >/dev/null
          done

          # 标题最后改：它是上面「已经对齐了」那个判断的依据，包没换完之前不能先说换好了。
          gh release edit desktop-latest --repo "$repo" \
            --title "$title" --notes-file latest-notes.md --latest=false
          move_tag

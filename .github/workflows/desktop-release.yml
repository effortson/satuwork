# 构建 Desktop 安装包（macOS）：建 GitHub Release，下载页直接从这里取。
#
# 打 `desktop-v0.1.0` 这样的 tag 触发。**tag 里的版本必须等于 tauri.conf.json 的 version**：
# 资产名是 Tauri 按那个 version 起的（`Satuwork_<版本>_<架构>.dmg`），下载页
# （gateway/ui/pages-download.js 的 DL_VERSION + dlBuilds）按 tag 拼地址——三处对不上，
# 页面上的按钮就是 404，而 CI 照样是绿的。所以在这儿先断言。
#
# 手动触发只出 artifact、**不建** Release：没有可挂的 tag。
#
# 不传 Gateway：Desktop 壳没有自动更新（见 desktop/README.md「还没做的事」），装的人
# 是从下载页拿包。本地 Bot 运行时是另一条线（local-bot-release.yml）。
#
# **没有签名和公证**：下载来的 .app 会被 Gatekeeper 拦（「已损坏」）。要发给外人之前
# 得先有 Developer ID 证书，届时在打包那步加 APPLE_* 环境变量。
#
# 先只出 macOS 两档。Windows 那档（下载页上的 .exe）要 windows runner，加进矩阵即可，
# 资产名是 `Satuwork_<版本>_x64-setup.exe`。
name: desktop-release

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      note:
        description: 这次发布的说明
        required: false
        default: ''

jobs:
  build:
    strategy:
      # 同 bot-release：一个架构挂了不取消另一个，但 release 要整套齐了才发。
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            tauri_arch: aarch64
            runner: macos-14
          - arch: x64
            tauri_arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # 这一份 Node 会被 prepare-runtime.mjs 原样拷进安装包（process.execPath），
      # 所以它的架构就是包里 Node 的架构——下面那步校验的正是这个。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 校验 runner 架构
        run: |
          got=$(node -p 'process.arch')
          [ "$got" = "${{ matrix.arch }}" ] || {
            echo "runner 是 $got，矩阵却说 ${{ matrix.arch }}" >&2; exit 1; }

      - name: 校验 tag 与 tauri.conf.json 版本一致
        if: github.ref_type == 'tag'
        run: |
          want="${GITHUB_REF_NAME#desktop-v}"
          got=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          [ "$got" = "$want" ] || {
            echo "tag 是 $want，tauri.conf.json 却是 $got：资产名会按后者起，下载页按前者找" >&2; exit 1; }

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'

      # --bundles dmg：targets 是 "all"，在 mac 上还会出一份 .app 目录，不用它。
      - name: 打包
        run: pnpm --filter satuwork-desktop build --bundles dmg

      - name: 核对产物
        id: dmg
        run: |
          set -euo pipefail
          shopt -s nullglob
          v=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          f="desktop/src-tauri/target/release/bundle/dmg/Satuwork_${v}_${{ matrix.tauri_arch }}.dmg"
          [ -f "$f" ] || { echo "没有 $f，实际：" >&2; ls -l desktop/src-tauri/target/release/bundle/dmg >&2 || true; exit 1; }
          ls -l "$f"
          echo "path=$f" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-mac-${{ matrix.arch }}
          path: ${{ steps.dmg.outputs.path }}
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # 建 Release 要写仓库内容
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-mac-*
          path: dist
          merge-multiple: true

      - run: ls -l dist

      - name: 建 GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTE: ${{ inputs.note }}
        run: |
          if [ -n "${NOTE:-}" ]; then
            printf '%s\n' "$NOTE" > notes.md
          else
            {
              echo 'Satuwork 桌面端（macOS）。Apple 芯片选 aarch64，Intel 选 x64。'
              echo
              echo '**安装包还没有签名**：下载后 macOS 会提示「已损坏，无法打开」。拖进「应用程序」后在终端执行一次：'
              echo
              echo '```'
              echo 'xattr -dr com.apple.quarantine /Applications/Satuwork.app'
              echo '```'
            } > notes.md
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md

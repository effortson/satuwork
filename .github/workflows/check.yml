# 每个 PR 跑一遍：类型 + 全量端到端。
#
# **只跟 PR，不跟 push。** 合并到 main 的那次推送内容和 PR 最后一次跑的一样，
# 再跑一遍纯属重复——同一份代码烧两份六分钟。代价是绕开 PR 直接推 main 的提交
# 没人查，需要的话去 Actions 页面手动点一次（workflow_dispatch）。
#
# 之前这个仓库的 CI 只有两条 tag 触发的发布流水线——`pnpm typecheck` 和
# `node e2e/run.mjs` 从来没在任何地方自动跑过。6 万行、三个包、零单测，
# 全部信心押在一条要先起 PostgreSQL 的 e2e 上，而它只在有人想起来的时候跑。
#
# e2e 自己会起 Gateway 和 Bot 子进程，所以这里只需要给它一个库。
# 端口用 5432 而不是本地那个 5434（5434 是为了躲开开发机上已有的实例，
# service container 里没这个问题），地址走 E2E_DATABASE_URL 覆盖。
name: check

on:
  pull_request:
  workflow_dispatch:

# 同一个 PR 连推几次，只跑最后一次。
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# 只读：检查不写仓库。
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: satuwork
          POSTGRES_PASSWORD: satuwork
          POSTGRES_DB: satuwork
        ports:
          - 5432:5432
        # e2e 起来第一件事就是建表，库没就绪会直接炸在那儿。
        options: >-
          --health-cmd "pg_isready -U satuwork -d satuwork"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      E2E_DATABASE_URL: postgres://satuwork:satuwork@127.0.0.1:5432/satuwork

    steps:
      - uses: actions/checkout@v7

      # 版本由根 package.json 的 packageManager 字段给。
      # 不写在这儿：bot-release / manager-release 也用这个 action，三处各写一遍必然会漂。
      # 别升到 v6：v6.1.0 拿锁文件核对 pnpm 原生二进制，锁文件里没有 darwin-x64 那份，Intel Mac 上装不上
      # （.github/dependabot.yml 挡了它的大版本升级）。版本注释单独放在下一行末尾，dependabot 才认得出、会跟着改。
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@v7
        with:
          # 席位机器上的下限也是 24（gateway/src/routes.ts 的 MIN_MANAGER_NODE）。
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: core 单测
        run: pnpm test:core

      # gateway/ui/core.js 是 core/src 打出来的产物，提交进仓库。改了源码忘了重打，表现是
      # 单测全绿、浏览器里跑的还是旧逻辑——所以这里重打一遍，和提交的那份必须一字不差。
      - name: core.js 没漂
        run: |
          pnpm build:core
          git diff --exit-code -- gateway/ui/core.js

      - name: e2e
        run: node e2e/run.mjs

  # 桌面壳单独一档：它是 Rust，和上面那档共用不了任何一步，串在一起只会让本来 3 分钟
  # 的 typecheck 等 Rust 编译。
  #
  # 只 `cargo check`，不打包：要的是「main.rs 改坏了当场知道」，而不是产物——真正的包
  # 三个系统各要一台机器，那是发版流水线的事。顺带这一档也是 Linux 那边唯一的编译
  # 信号（webview 的开发库只有在 Linux 上才装得起来）。
  desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Tauri 在 Linux 上编译要 webkit2gtk 的开发头文件；4.1 是 Tauri 2 的那一档。
      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 分支，2026-09-03
        with:
          # 按 SHA 引用时它没法从 ref 名（@stable）推出工具链，得写明。
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: './desktop/src-tauri -> target'

      # --locked：Cargo.lock 进了版本库，CI 不该悄悄把它升了再说「过了」。
      - name: cargo check
        working-directory: desktop/src-tauri
        run: cargo check --locked

  # Windows 单独一档，**跑 cargo test 而不只是 check**：main.rs 里有一整段只在 Windows 编译的
  # 代码（本地 Bot 运行时解包时的 junction / 硬链接降级，见 unpack_links_windows），上面那档
  # 在 Linux 上一行都编译不到。以前它要等发版流水线打 Windows 包才第一次被编译，坏了就是发版
  # 当天才知道；那段的两条 Windows 单测（强制走降级、坏链接不留半个版本目录）也只有这里跑。
  desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 分支，2026-09-03
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: './desktop/src-tauri -> target'

      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test --locked

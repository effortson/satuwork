# 给已安装的 Desktop 发布本地 Bot 运行时。它不替换 Desktop 壳，也不会重启运行中的任务；
# 客户端在下次启动第一颗本地 Bot 前下载、校验并原子切换。
name: local-bot-release

on:
  push:
    tags: ['local-bot-v*']
  workflow_dispatch:
    inputs:
      note:
        description: 这次发布的说明
        required: false
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-x64
            platform: darwin
            arch: x64
            runner: macos-15-intel
          - target: darwin-arm64
            platform: darwin
            arch: arm64
            runner: macos-14
          - target: windows-x64
            platform: win32
            arch: x64
            runner: windows-latest
          - target: windows-arm64
            platform: win32
            arch: arm64
            runner: windows-11-arm
          - target: linux-x64
            platform: linux
            arch: x64
            runner: ubuntu-latest
          - target: linux-arm64
            platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 校验 runner 目标
        run: |
          got_platform=$(node -p 'process.platform')
          got_arch=$(node -p 'process.arch')
          [ "$got_platform" = "${{ matrix.platform }}" ] && [ "$got_arch" = "${{ matrix.arch }}" ] || {
            echo "runner 是 $got_platform-$got_arch，矩阵却说 ${{ matrix.platform }}-${{ matrix.arch }}" >&2
            exit 1
          }

      - id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            base="${GITHUB_REF_NAME#local-bot-v}"
          else
            base=$(node -p "require('./bot/package.json').version")
          fi
          echo "base=${base}+${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: 打本地运行时包
        run: node desktop/scripts/pack-runtime-release.mjs --version "${{ steps.version.outputs.base }}"

      - uses: actions/upload-artifact@v4
        with:
          name: local-bot-${{ matrix.target }}
          path: dist/local-bot-*.tgz
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: local-bot-*
          path: dist
          merge-multiple: true

      - run: ls -l dist

      - name: 建 GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTE: ${{ inputs.note }}
        run: |
          # --latest=false：几条发布线共用一个 Release 列表，仓库的「Latest」不归哪一条——
          # 不写的话 GitHub 按日期自动挑，谁最后发谁就是 Latest。没有代码依赖 releases/latest。
          gh release create "$GITHUB_REF_NAME" dist/*.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "${NOTE:-Desktop 本地 Bot 运行时（按操作系统和架构分包）。运行中的任务不会被重启。}" \
            --latest=false

  # 登记到 Gateway：按 Release 的下载地址登记，不 PUT 整包（Vercel 上请求体上限 4.5 MB，
  # PUT 一律 413）。顺序、校验、重跑的约定都在 register-release.yml 里。
  # 手动触发没有 Release、也就没有可登记的地址：那种只出 artifact。
  register:
    needs: release
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/register-release.yml
    with:
      tag: ${{ github.ref_name }}
      note: ${{ inputs.note || '' }}
    secrets: inherit

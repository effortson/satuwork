# 构建机器管家发布包：建 GitHub Release + 登记到 Gateway。
#
# 和 bot-release 是同一套流程，区别只在包和登记路径（/platform/manager-releases）。
# 但影响面不一样：**机器上的管家会自己升到这个版本**——心跳时 Gateway 下发期望
# 版本，各台机器自行换版。所以推 tag 之前先想清楚要不要立刻全量。
#
# 灰度/回滚都在 Gateway 侧：owner 在管家发布页把「期望版本」设成某一版，机器下一
# 轮心跳就跟过去。传包本身不会立刻改变任何一台机器——除非期望版本是空的（那时
# 跟最新发布走）。
#
# **两个架构分别出包。** 包里带 esbuild 的原生二进制，架构不对就起不来。好在管家
# 换版前会拿新包跑一次 `--selftest`，架构不对会在那一步失败、`current` 不动、原因
# 报回心跳——不会变砖，但也升不上去。版本号带架构后缀，两份包是两条独立发布记录。
#
# 需要两个 secret：GATEWAY_URL、GATEWAY_PLATFORM_TOKEN。
name: manager-release

on:
  push:
    tags: ['manager-v*']
  workflow_dispatch:
    inputs:
      note:
        description: 这次发布的说明
        required: false
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # pack.mjs 走 `pnpm deploy`，要先有装好的 workspace。
      - run: pnpm install --frozen-lockfile

      # 管家包里的 TypeScript 是运行时才转的，编译期兜不住的错只有 tsc 能看见。
      # 这一步失败就别发：装出去的管家起不来，机器上没有 SSH 可以救。
      - run: pnpm --filter satuwork-manager typecheck

      - name: 校验 runner 架构
        run: |
          got=$(node -p 'process.arch')
          [ "$got" = "${{ matrix.arch }}" ] || {
            echo "runner 是 $got，矩阵却说 ${{ matrix.arch }}" >&2; exit 1; }

      - id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            base="${GITHUB_REF_NAME#manager-v}"
          else
            base=$(node -p "require('./manager/package.json').version")
          fi
          echo "v=${base}+${GITHUB_SHA:0:7}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: 打包
        run: node manager/pack.mjs --version "${{ steps.version.outputs.v }}"

      - uses: actions/upload-artifact@v4
        with:
          name: manager-pack-${{ matrix.arch }}
          path: dist/manager-*.tgz
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: manager-pack-*
          path: dist
          merge-multiple: true

      - run: ls -l dist

      - name: 建 GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTE: ${{ inputs.note }}
        run: |
          # --latest=false：几条发布线共用一个 Release 列表，仓库的「Latest」不归哪一条——
          # 不写的话 GitHub 按日期自动挑，谁最后发谁就是 Latest。没有代码依赖 releases/latest。
          gh release create "$GITHUB_REF_NAME" dist/*.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "${NOTE:-管家发布包（x64 / arm64）。没 pin 期望版本的机器会在下一轮心跳自动升到最新。}" \
            --latest=false

  # 登记到 Gateway：按 Release 的下载地址登记，不 PUT 整包（Vercel 上请求体上限 4.5 MB，
  # PUT 一律 413）。顺序、校验、重跑的约定都在 register-release.yml 里。
  # 手动触发没有 Release、也就没有可登记的地址：那种只出 artifact。
  register:
    needs: release
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/register-release.yml
    with:
      tag: ${{ github.ref_name }}
      note: ${{ inputs.note || '' }}
    secrets: inherit

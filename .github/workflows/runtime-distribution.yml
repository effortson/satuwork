# Regional runtime artifacts only; never publishes international releases or registers foreign Gateways.
name: runtime-distribution
run-name: runtime-cn/${{ github.ref_name }}/${{ inputs.component }} ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      component:
        description: 'all: manager + both Bots; bots: server Bot + local Bot; or one component'
        type: choice
        options: [all, bots, manager, bot, local-bot]
        required: true
        default: all
      version:
        description: Optional X.Y.Z base; empty uses each package version. Build ID makes releases immutable.
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: runtime-cn-${{ github.ref_name }}-${{ inputs.component }}
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test scripts/runtime-release.test.mjs
      - id: targets
        env:
          RUNTIME_COMPONENT: ${{ inputs.component }}
          RUNTIME_VERSION: ${{ inputs.version }}
        run: |
          value=$(node scripts/runtime-release.mjs matrix)
          echo "matrix=$value" >> "$GITHUB_OUTPUT"
  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      RUNTIME_COMPONENT: ${{ inputs.component }}
      RUNTIME_VERSION: ${{ inputs.version }}
      RUNTIME_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check selected source and target
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/runtime-release.mjs matrix >/dev/null
          node -e 'if(process.platform!==process.argv[1]||process.arch!==process.argv[2])throw Error("Native runner mismatch")' '${{ matrix.platform }}' '${{ matrix.arch }}'
      - name: Typecheck runtime sources
        if: matrix.platform == 'linux'
        run: |
          if [ "$RUNTIME_COMPONENT" = all ] || [ "$RUNTIME_COMPONENT" = manager ]; then pnpm --filter satuwork-manager typecheck; fi
          if [ "$RUNTIME_COMPONENT" != manager ]; then pnpm --filter satuwork typecheck; fi
      - name: 导入签名证书
        if: matrix.platform == 'darwin'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          for k in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            [ -n "${!k:-}" ] || { echo "没有 $k：macOS 包签不了名" >&2; exit 1; }
          done
          kc="$RUNNER_TEMP/satuwork-signing.keychain-db"
          kp=$(openssl rand -hex 24)
          p12="$RUNNER_TEMP/cert.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" >/dev/null
          # 加进搜索列表（保留原有的），Tauri 按 APPLE_SIGNING_IDENTITY 找身份时才找得到。
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$p12"
          security find-identity -v -p codesigning "$kc"
          security find-identity -v -p codesigning "$kc" | grep -qF "$APPLE_SIGNING_IDENTITY" || {
            echo "p12 里没有「$APPLE_SIGNING_IDENTITY」这个身份（导出时要连证书带私钥一起）" >&2; exit 1; }
          echo "SATUWORK_CODESIGN_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "SATUWORK_CODESIGN_KEYCHAIN=$kc" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.platform == 'win32'
      - name: Build Windows client unpacker
        if: matrix.platform == 'win32'
        run: cargo build --locked --release --manifest-path scripts/runtime-smoke/Cargo.toml
      - name: Build and exercise native packages
        run: node scripts/runtime-release.mjs build
      - name: Sign regional provenance and package hashes
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.ref_name == 'main' && secrets.CN_DESKTOP_STABLE_SIGNING_KEY || secrets.CN_DESKTOP_BETA_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.ref_name == 'main' && secrets.CN_DESKTOP_STABLE_SIGNING_PASSWORD || secrets.CN_DESKTOP_BETA_SIGNING_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          pnpm --filter satuwork-desktop exec tauri signer sign "$GITHUB_WORKSPACE/out/runtime-${RUNTIME_TARGET}.json"
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-cn-${{ inputs.component }}-${{ matrix.target }}
          path: out/*
          retention-days: 14
      - name: Remove temporary Apple signing keychain
        if: always() && matrix.platform == 'darwin'
        run: |
          if [ -n "${SATUWORK_CODESIGN_KEYCHAIN:-}" ]; then security delete-keychain "$SATUWORK_CODESIGN_KEYCHAIN"; fi

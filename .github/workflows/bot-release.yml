# 构建 Bot 发布包：建 GitHub Release + 登记到 Gateway。
#
# Gateway 不构建 Bot，只登记包：这里打、挂到 Release 上，Gateway 按下载地址登记
# （register-release.yml），席位那边再从它部署。
# 需要两个 secret：GATEWAY_URL（如 https://gw.example.com）、GATEWAY_PLATFORM_TOKEN。
#
# 打 `bot-v1.2.3` 这样的 tag 触发，版本号是 `1.2.3+<短 sha>-<架构>`；手动触发时
# 版本号取 bot/package.json 的 version 加短 sha 加架构，**不建** Release、也不登记。
#
# **两个架构分别出包。** 包里带 esbuild 的原生二进制，架构不对就起不来，而且
# `pack.mjs` 只校验「是不是 linux-」，不校验是哪个 linux。所以版本号必须带架构后缀，
# 两份包在 Gateway 上是两条独立的发布记录。
name: bot-release

on:
  push:
    tags: ['bot-v*']
  workflow_dispatch:
    inputs:
      note:
        description: 这次发布的说明
        required: false
        default: ''

jobs:
  build:
    strategy:
      # 一个架构挂了不该顺手取消另一个：另一个的日志仍然有用。
      # 但下面的 release 依赖整个 build，缺一个架构就不发——半套发布比不发更糟，
      # 因为没 pin 的机器会跟着「最新」走。
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # pack.mjs 走 `pnpm deploy`，要先有装好的 workspace。
      - run: pnpm install --frozen-lockfile

      # 出包前先确认架构真的对上了：runner 换了标签、或者矩阵写错，
      # 在这儿失败远好过让一台机器装上一个起不来的包。
      - name: 校验 runner 架构
        run: |
          got=$(node -p 'process.arch')
          [ "$got" = "${{ matrix.arch }}" ] || {
            echo "runner 是 $got，矩阵却说 ${{ matrix.arch }}" >&2; exit 1; }

      - id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            base="${GITHUB_REF_NAME#bot-v}"
          else
            base=$(node -p "require('./bot/package.json').version")
          fi
          echo "v=${base}+${GITHUB_SHA:0:7}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: 打包
        run: node bot/pack.mjs --version "${{ steps.version.outputs.v }}"

      - uses: actions/upload-artifact@v4
        with:
          name: bot-pack-${{ matrix.arch }}
          path: dist/bot-*.tgz
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # 建 Release 要写仓库内容
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bot-pack-*
          path: dist
          merge-multiple: true

      - run: ls -l dist

      # 只有 tag 触发才建 Release：手动触发没有可挂的 tag。
      - name: 建 GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTE: ${{ inputs.note }}
        run: |
          # --latest=false：几条发布线共用一个 Release 列表，仓库的「Latest」不归哪一条——
          # 不写的话 GitHub 按日期自动挑，谁最后发谁就是 Latest。没有代码依赖 releases/latest。
          gh release create "$GITHUB_REF_NAME" dist/*.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "${NOTE:-Bot 发布包（x64 / arm64）。装到席位机器上时**架构必须对上**。}" \
            --latest=false

  # 登记到 Gateway：按 Release 的下载地址登记，不 PUT 整包（Vercel 上请求体上限 4.5 MB，
  # PUT 一律 413）。顺序、校验、重跑的约定都在 register-release.yml 里。
  # 手动触发没有 Release、也就没有可登记的地址：那种只出 artifact。
  register:
    needs: release
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/register-release.yml
    with:
      tag: ${{ github.ref_name }}
      note: ${{ inputs.note || '' }}
    secrets: inherit

# 只管 workflow 里的 actions：第三方的都钉在 commit SHA 上（tag 可以被人挪），
# 升级就靠这里每周开 PR，把 SHA 和后面的 `# vX.Y.Z` 注释一起改掉。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    # pnpm/action-setup v6.1.0 要拿锁文件核对 pnpm 原生二进制，而 pnpm-lock.yaml 里没有
    # @pnpm/exe.darwin-x64——Intel Mac 那几档（桌面端 x64、本地 Bot darwin-x64）直接装不上 pnpm。
    # 先停在 v4；锁文件补上各平台那份之后再放开。
    ignore:
      - dependency-name: pnpm/action-setup
        update-types: ['version-update:semver-major']

[package]
name = "tauri-plugin-satu-share"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false
description = "手机壳的「下载」：把页面要存的文件交给系统的分享面板（iOS 的存储到文件、Android 的分享选择器）。"
# tauri-plugin 的构建脚本要求 links 和包名一致。
links = "tauri-plugin-satu-share"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

name: satuwork-mobile
options:
  bundleIdPrefix: sg.dami.satuwork.mobile
  deploymentTarget:
    iOS: 15.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: Satuwork
      PRODUCT_BUNDLE_IDENTIFIER: sg.dami.satuwork.mobile
      DEVELOPMENT_TEAM: 37TR7L5SSP
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  satuwork-mobile_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
      - path: satuwork-mobile_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
    info:
      path: satuwork-mobile_iOS/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        # 隐私权限说明：页面一碰相机/麦克风/相册，系统就查这几条，缺了直接杀进程（TCC SIGABRT）。
        # 这里才是真源——tauri ios build 会跑 xcodegen 按本文件整份重写 Info.plist，只改 Info.plist 会被冲掉。
        # 相机：头像、对话附件的 <input type=file> 在 iOS 上带「拍照」项（App Review 2026-11 因此闪退被拒）。
        NSCameraUsageDescription: "Satuwork 用相机拍照，作为头像或对话附件上传。Satuwork uses the camera to take photos for your avatar or chat attachments."
        # 麦克风：对话框语音输入（gateway/ui/chat-voice.js 的 getUserMedia），以及附件「录像」带声音。
        NSMicrophoneUsageDescription: "Satuwork 用麦克风把你说的话转成文字，填进对话输入框。Satuwork uses the microphone to turn your speech into text in the chat box."
        # 相册：附件选图走系统选择器一般不用授权，留着防个别系统版本走老路径时闪退。
        NSPhotoLibraryUsageDescription: "Satuwork 从相册选图片，作为头像或对话附件上传。Satuwork lets you pick photos from your library for your avatar or chat attachments."
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.1.1
        CFBundleVersion: "0.1.0"
    entitlements:
      path: satuwork-mobile_iOS/satuwork-mobile_iOS.entitlements
      properties:
        aps-environment: development
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      # 外层已安装依赖；Xcode 的环境会让 pnpm 11 再次检查并重装，CI 中因没有 TTY 而失败。
      # 直接运行已安装的 CLI，避免在 Xcode 的构建脚本中修改 node_modules。
      - script: node "$SRCROOT/../../../node_modules/@tauri-apps/cli/tauri.js" ios xcode-script -v --platform ${PLATFORM_DISPLAY_NAME:?} --sdk-root ${SDKROOT:?} --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration ${CONFIGURATION:?} ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a

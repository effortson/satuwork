[package]
name = "satuwork-mobile"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

# 手机上 Tauri 把应用编成库，由 Xcode / Gradle 工程装起来，所以入口在 lib.rs；main.rs 只给桌面上跑 cargo test 用。
[lib]
name = "satuwork_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 站外链接交给系统浏览器——壳子里没有地址栏，跳出去就回不来了。手机上它只开得了 URL，够用。
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

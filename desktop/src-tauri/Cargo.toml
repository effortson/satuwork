[package]
name = "satuwork-desktop"
version = "0.1.1"
edition = "2021"
rust-version = "1.77.2"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Dependabot 会报 glib 0.18 的一条中危通告（GHSA-wrw7-89jp-8q8g：VariantStrIter 的迭代器实现
# 不健全，0.20 修）。这里修不了：tauri 2.11 钉着 gtk ^0.18，gtk 0.18 钉着 glib ^0.18，
# `cargo update -p glib --precise 0.20.0` 会被这条链顶回来，只能等 tauri 升 gtk。
# 影响面也小——glib 只进 Linux 目标（gtk/webkit2gtk 那一串），壳子自己一行 glib 都没碰。
# tauri 升上去之后把这段删掉；在那之前，那条告警请按「没有修法」处理。
tauri = { version = "2", features = [] }
# 站外链接交给系统浏览器——壳子里没有地址栏，跳出去就回不来了。
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
tar = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"

# 壳子不该有调试符号那么大。桌面包是用户下载的东西，几 MB 和几十 MB 的区别他们看得见。
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

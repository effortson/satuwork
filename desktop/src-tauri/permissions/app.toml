[[permission]]
identifier = "setup-commands"
description = "允许本地设置页读取、检查并保存 Gateway 地址。"
commands.allow = ["current_server", "startup_error", "connect"]

[[permission]]
identifier = "gateway-server-commands"
description = "允许主窗口（登录页的「服务器」弹窗）读取、检测并切换 Gateway 地址；切换前壳子自己再检测一遍。"
commands.allow = ["gateway_server_info", "check_gateway_server", "use_gateway_server"]

[[permission]]
identifier = "local-bot-commands"
description = "允许主窗口启动、停止和查询本人本地 Bot，通过系统选择器批准额外目录，列出和撤销已批准的目录。"
commands.allow = [
  "start_local_bot",
  "stop_local_bot",
  "local_bot_status",
  "approve_local_directory",
  "local_directories",
  "revoke_local_directory",
]

[[permission]]
identifier = "seat-desktop-commands"
description = "允许主窗口在挂内嵌桌面前把席位机器的源报给导航守卫。"
commands.allow = ["allow_seat_desktop"]

[[permission]]
identifier = "desktop-update-commands"
description = "允许主窗口查询、检查并安装 Desktop 新版本（下载地址与签名公钥都写死在壳里，页面只能说「查」和「装」）。"
commands.allow = [
  "desktop_update_status",
  "desktop_update_check",
  "desktop_update_install",
]

[[permission]]
identifier = "desktop-notification-commands"
description = "允许包内主窗口绑定当前通知会话、显示固定事件提醒；原生层仅在应用窗口未聚焦时发送。"
commands.allow = ["desktop_notification_session", "desktop_notify", "desktop_clear_notifications"]

[[permission]]
identifier = "download-commands"
description = "允许包内主窗口通过系统另存为窗口保存文件字节；目标路径由用户在窗口中选择。"
commands.allow = ["save_download"]

[[permission]]
identifier = "desktop-window-commands"
description = "允许包内主窗口和设置页控制自身的关闭、最小化、全屏、缩放与拖拽；不能指定其他窗口。"
commands.allow = ["desktop_window_action", "desktop_window_state"]

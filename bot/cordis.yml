# Satuwork 的根组合。
#
# 每行一个插件条目，`name` 是模块说明符。条目**并发**挂载——先后由 `inject` 的服务
# 依赖决定，不由行序决定。下面的分组只是给人看的。
#
# 启动：`pnpm dev`
#
# 框架用 DeepSeek vendor 的那套（@deepseek-ai/cordis 4.0.1，上游主线还在 RC）；
# dsh 的产品包一个不用，产品代码全部在 src/ 下。

# ── 基础设施 ──────────────────────────────────────────────────────────────
- name: '@deepseek-ai/cordis-plugin-timer'

- name: './src/server/index.ts'
  config:
    host: 127.0.0.1
    port: 3082

# 日志。**必须有**：在它之前 ctx.logger 是 undefined，代码里那 16 处 ?.warn?.() 全是
# 空转，席位的 journal 里除了 systemd 什么都没有——出了问题只能靠猜。
- name: './src/logger/index.ts'

# ── 核心 ──────────────────────────────────────────────────────────────────
# 运行时配置与非会话数据（SQLite，$SATUWORK_HOME/satuwork.db）。
# 会话日志不在这里——那是追加式 JSONL，两种数据的访问形态不一样。
- name: './src/storage/index.ts'

# 事件日志。一切从它派生：模型看到的历史、UI、以后的投影与统计。
- name: './src/session/index.ts'

# 本机 Bot 名册。会话属于 Bot。不接 Gateway。
- name: './src/registry/index.ts'

# 入站闸门。`/api/*` 默认要席位票（sat_），只有 /api/health 例外。
# 守卫用 server.use（prepend），跑在所有路由之前。
- name: './src/guard/index.ts'

# 模型接缝：Gateway 的薄客户端（GATEWAY_URL + /v1/*）。密钥不在本机。
- name: './src/llm/index.ts'

# 工具注册表与执行管道；策略挂在它的 waterfall 上。
- name: './src/tools/index.ts'
- name: './src/tools/builtin.ts'

# 任务清单（todo）。一轮最多连跑 120 步，而「我本来打算做什么」不能只存在于几十条
# 消息之前的那段话里——那段话会被摘要压掉。存 SQLite，跨轮跨重启都读得回来。
- name: './src/tools/todo.ts'

# 工作区本身：根目录、越界检查、附件落盘、预览取流。
# **必须排在工具和 web 前面**——那两处都 inject 它，根目录只能有这一份。
# 根目录是 $SATUWORK_WORK_DIR（部署注入的共享 work 目录），本地回落 $SATUWORK_HOME/work。
- name: './src/workspace/index.ts'

# 工作区里的手。file 工具集看文件改文件（read_file / write_file / patch / search_files），
# terminal 工具集跑命令。为什么是这个形状见 docs/file-terminal-tools.md。
- name: './src/tools/file.ts'
- name: './src/tools/terminal.ts'

# 网页：搜索与提取。后端和密钥都在 Gateway（/runtime/web/*），这边只做形状与摘要。
# 排在 workspace 之后——web_extract 的 save 要往工作区写。
- name: './src/web-search/index.ts'
- name: './src/tools/web.ts'

# 席位桌面上那个 Chrome 的遥控器（CDP，127.0.0.1:$SATUWORK_CDP_PORT）。
# **连的是员工自己在用的那一个**——登录态就在那份 profile 里，这是整套工具唯一的理由。
# 工具本身能不能进工具表，看公司模版里的 browser.on；每一次调用拦不拦，在 policy。
- name: './src/browser/index.ts'
- name: './src/browser/tools.ts'

# 翻自己的历史：history_read / history_search。只读，走 sessions 服务不碰文件系统。
# 它是上下文压缩的前提——压掉的那一段还调得回来，压缩才不是有损的。
- name: './src/tools/history.ts'

# Gateway 目录：拉 Skill / MCP / Bot，钉到名册，连 HTTP MCP。
- name: './src/catalog/index.ts'

# Skill 工具集：skill_view / skills_list / skill_manage。
# **排在 catalog 后面**——它 inject 'catalog'，读的是目录同步下来的那份缓存，
# 写完之后也要让目录立刻把新的那条拉回来。为什么正文不再全量进提示词见 docs/skills.md。
- name: './src/tools/skill.ts'

# 长期记忆：memory_write / memory_list（见 docs/memory.md）。
# **同样排在 catalog 后面**，理由一字不差：读的是目录同步下来的那份缓存，写完也要
# 让目录立刻把新的那条拉回来。它和 Skill 的分工是「事实 vs 方法」，不是两个档位。
- name: './src/tools/memory.ts'

# 日常任务：routine_list / routine_manage。定义和调度仍然只在 Gateway；这两把只是让当前
# Bot 用自己的席位票查看、新增、修改或立即试跑，不在席位本地另起一套定时器。
- name: './src/tools/routine.ts'

# 转人工的交接单：状态、落盘、交还（见 docs/handoff.md）。
# 单独一个插件而不是塞进 policy：policy 跑在工具执行的关键路径上，而交接单要活过重启、
# 要被 web 路由直接读写，两件事的生命周期不一样。
- name: './src/policy/handoff.ts'

# 行为边界：公司模版上那三个开关的**执行点**（tools/pre-execute 短路）。
# 排在工具与目录之后——它要按「这把工具属于哪台 MCP」判断，那张表由目录维护。
# 名字是 policy 不是 guard：src/guard 是入站席位票的闸门，两件事不能同名。
- name: './src/policy/index.ts'

# 会话索引上报 + 给 Gateway 按 sessionId 拉全文（机器凭证）+ 实例 ready。
- name: './src/session/gateway.ts'

# turn/step 循环，把上面三者串起来。
- name: './src/agent/index.ts'
  config:
    provider: deepseek
    model: deepseek-v4-flash
    system: 你是 Satuwork 的 AI 员工。用简洁、专业的中文回答。需要当前时间、查看或修改文件、执行命令时调用工具，不要凭猜测。
    # 一轮里最多连着跑多少步（一步 = 一次模型调用加它那批工具）。到顶收口，对话里留一句
    # 说明，回「继续」接着跑。防的是绕不出来的工具循环——上下文那条路有压缩兜着，撞不到墙。
    maxSteps: 120

# 委派：把一件事交给一个新开的、干净的子代理（docs/delegation.md）。
# **必须排在 agent 后面**——它 inject 'agents'，子代理的那一轮由 runTask 跑。
- name: './src/tools/delegate.ts'

# 公司自动对话审计：Gateway 定窗口和模型，席位只读本地 JSONL、脱敏总结并可靠上报。
- name: './src/conversation-audit/index.ts'

# HTTP API（无 SPA）。对话 UI 在 Gateway。
- name: './src/web/index.ts'

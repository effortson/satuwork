# Satuwork Gateway + PostgreSQL。
#
# Bot 不在这里：它是按 (账号, botId) SSH 部署到席位机器上的，不是容器编排出来的。
#
#   docker compose up -d          起 PG 和 Gateway
#   docker compose up -d postgres 只起 PG（本地 pnpm dev 连它）
#
# 宿主机端口 5434 → 容器 5432：5432 在本机已被别的实例占着。
#
# **项目名必须写死**。compose 默认拿目录名当项目名，而本机
# /Users/yuzhao/git/adix/satuwork 也叫 satuwork、也有一个 postgres 服务和一个
# pgdata 卷——不写死的话两边会共用容器名和卷名，互相把对方的库重建掉。
name: satuwork-gateway

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-satuwork}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-satuwork}
      POSTGRES_DB: ${POSTGRES_DB:-satuwork}
    ports:
      # 只映射到回环。库不需要对外，而这里的用户名口令是开发默认值——
      # 映射到 0.0.0.0 等于把整个库连同默认口令挂在公网上。
      - '127.0.0.1:${POSTGRES_PORT:-5434}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Gateway 必须等库真的能连上再起，否则第一次建表就炸。
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-satuwork} -d ${POSTGRES_DB:-satuwork}']
      interval: 3s
      timeout: 3s
      retries: 20

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 容器内连的是服务名和容器端口，不是宿主机的 5434。
      GATEWAY_DATABASE_URL: postgres://${POSTGRES_USER:-satuwork}:${POSTGRES_PASSWORD:-satuwork}@postgres:5432/${POSTGRES_DB:-satuwork}
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: '3080'
      GATEWAY_ACCESS_HOST: ${GATEWAY_ACCESS_HOST:-satuwork.com}
      GATEWAY_MACHINE_TOKEN: ${GATEWAY_MACHINE_TOKEN:-}
      GATEWAY_PLATFORM_TOKEN: ${GATEWAY_PLATFORM_TOKEN:-}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      # 和 PG 一样只映射到回环：生产前面本来就要有 Caddy/nginx 终结 TLS
      # （见 gateway/deploy/*.example），Gateway 自己的 3080 没有理由直接挂在公网上。
      # 真要裸奔对外（比如内网测试），把左边的 127.0.0.1: 去掉即可。
      - '127.0.0.1:${GATEWAY_PORT:-3080}:3080'
    volumes:
      # JWT 密钥对和 Bot 发布包在磁盘上，不在库里——重启不能让已发出的票全失效。
      - gwdata:/var/lib/satuwork-gateway
    healthcheck:
      # GET /health 是 gateway/src/routes/auth.ts 里那条不鉴权的探活。镜像是 slim 的，
      # 没有 curl/wget，用 node 自己的 fetch 问。
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3080/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── 可选：自托管 SearXNG ────────────────────────────────────────────────
  #
  # **默认不起**。`docker compose up -d` 还是只有 PG 和 Gateway——搜索后端是
  # 平台按需选的一家（tavily / firecrawl / duckduckgo / searxng），不选它的部署
  # 不该被迫多跑两个容器、多占一个端口。要它的时候显式点名：
  #
  #   docker compose --profile searxng up -d      # 连 PG、Gateway 一起
  #   docker compose --profile searxng up -d searxng   # 只起它
  #   docker compose --profile searxng down       # 停（不带 profile 停不掉它）
  #
  # 配置在 ./searxng/core-config/settings.yml，那里开了 json 输出——不开就没有
  # API，web-tools.ts 打 format=json 会拿回一坨 HTML。
  #
  # 密钥：根目录 .env 里填了 SEARXNG_SECRET 就用它（.env 不进 git）；没填就在第一次
  # 启动时随机生成一把，存进 searxng-data 卷里的 .secret_key，之后重启一直用这把。
  # 不给默认值——以前那个 ultrasecretkey 谁都知道，等于没有。
  #
  # 端口只绑 127.0.0.1，和 PG、Gateway 一样：限流器是关的，端口一对外就是个谁都能
  # 用的搜索代理。要给别的机器用，前面自己挂反代加鉴权。
  #
  # 没有 valkey：它只在开限流器时才用得上，而这台是自己人的 API 后端，限流器是关的
  # （官方 compose 里那个 valkey 其实也没接上，镜像默认 valkey.url = false）。
  searxng:
    profiles: ['searxng']
    # 钉死版本：latest 每天都在滚，settings.yml 的字段隔几个月就会对不上，一次
    # `compose pull` 就能把搜索弄挂。要升就改 SEARXNG_VERSION，顺手核对一遍 settings.yml。
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-2026.9.3-a1144dda3}
    restart: unless-stopped
    environment:
      # 空串等于没填，交给下面的 entrypoint 生成。
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8888/}
    # 包一层镜像自己的入口脚本，只多做「没密钥就生成一把存进数据卷」这一件事。
    # `$$` 是给 compose 转义的，到容器里就是 `$`。
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$${SEARXNG_SECRET:-}" ]; then
          f=/var/cache/searxng/.secret_key
          [ -s "$$f" ] || (umask 077 && head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$$f")
          SEARXNG_SECRET=$$(cat "$$f")
          export SEARXNG_SECRET
        fi
        exec /usr/local/searxng/entrypoint.sh "$$@"
      - searxng-entrypoint
    ports:
      # 只绑本机，理由见上面。同一套 compose 里的 Gateway 走 http://searxng:8080，不经宿主机。
      - '127.0.0.1:${SEARXNG_PORT:-8888}:8080'
    volumes:
      - ./searxng/core-config/:/etc/searxng/:Z
      - searxng-data:/var/cache/searxng/

volumes:
  pgdata:
  gwdata:
  # 只有 favicon 缓存，删了自己会重建。
  searxng-data:
